<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>YouTube player for OBS</title>
  <style>
    html, body { height: 100%; margin: 0; background: #000; color: #fff; font: 24px system-ui, sans-serif; }
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
    p { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; margin: 0; }
  </style>
</head>
<body>
  <script>
    // YouTube's player only runs inside a page on a website, so an OBS Browser source loads this
    // page with ?v=<video id>. It keeps nothing and sends nothing except loading YouTube's player.
    const id = new URLSearchParams(location.search).get('v') ?? '';
    if (/^[A-Za-z0-9_-]{11}$/.test(id)) {
      const frame = document.createElement('iframe');
      frame.src = `https://www.youtube.com/embed/${id}?autoplay=1&playsinline=1&rel=0&cc_load_policy=0&enablejsapi=1`;
      frame.allow = 'autoplay; encrypted-media; fullscreen';
      frame.referrerPolicy = 'strict-origin-when-cross-origin';
      frame.title = 'YouTube player';
      document.body.append(frame);

      // YouTube turns captions on by default for some videos and cc_load_policy=0 doesn't stop it,
      // so the running player is told, repeatedly because captions can come back after an ad.
      const send = (message) => frame.contentWindow.postMessage(JSON.stringify(message), 'https://www.youtube.com');
      setInterval(() => {
        send({ event: 'listening' });
        send({ event: 'command', func: 'setOption', args: ['captions', 'track', {}] });
        send({ event: 'command', func: 'unloadModule', args: ['captions'] });
      }, 2000);
    } else {
      const message = document.createElement('p');
      message.textContent = 'No valid YouTube video ID';
      document.body.append(message);
    }
  </script>
</body>
</html>
